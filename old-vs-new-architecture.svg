<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1560" height="820" fill="#ffffff"/>
  <text x="30" y="34" font-size="21" font-weight="700" fill="#222">Listing Intelligence Agent — Old vs New Architecture</text>
  <rect x="980" y="16" width="200" height="24" rx="5" fill="#d5e8d4" stroke="#82B366"/>
  <text x="992" y="32" font-size="11" fill="#2f5a2a">green = added this round</text>
  <rect x="1195" y="16" width="140" height="24" rx="5" fill="#dae8fc" stroke="#6C8EBF"/>
  <text x="1207" y="32" font-size="11" fill="#2b4a72">blue = existing</text>

  <rect x="20" y="60" width="500" height="740" rx="10" fill="#f5f5f5" stroke="#999"/>
  <text x="40" y="88" font-size="15" font-weight="700" fill="#555">BEFORE — deep-research only</text>

  <rect x="50" y="120" width="440" height="92" rx="8" fill="#dae8fc" stroke="#6C8EBF"/>
  <text x="70" y="145" font-size="13" font-weight="700" fill="#222">Extension — React side panel + scraper</text>
  <text x="70" y="165" font-size="12" fill="#444">Detect product · Run research (streamed)</text>
  <text x="70" y="185" font-size="12" fill="#777" font-style="italic">READ-ONLY results</text>

  <rect x="50" y="252" width="440" height="104" rx="8" fill="#dae8fc" stroke="#6C8EBF"/>
  <text x="70" y="277" font-size="13" font-weight="700" fill="#222">Backend — /api/research (single endpoint)</text>
  <text x="70" y="297" font-size="12" fill="#444">4 lens agents + synthesizer + verifier</text>
  <text x="70" y="317" font-size="12" fill="#777" font-style="italic">all Sonnet · prompt-text JSON (fragile parsing)</text>

  <rect x="50" y="396" width="440" height="64" rx="8" fill="#dae8fc" stroke="#6C8EBF"/>
  <text x="70" y="433" font-size="13" font-weight="700" fill="#222">Claude Sonnet 4.6  +  web_search</text>

  <rect x="50" y="500" width="440" height="92" rx="8" fill="none" stroke="#B85450" stroke-dasharray="6 4"/>
  <text x="70" y="527" font-size="12" fill="#B85450">✗ no persistence  ·  ✗ no verify / drift  ·  ✗ no eval</text>
  <text x="70" y="548" font-size="12" fill="#B85450">✗ result cannot be edited or copied</text>
  <text x="70" y="569" font-size="12" fill="#B85450">✗ no way to know if the agent is any good</text>

  <line x1="270" y1="212" x2="270" y2="252" stroke="#6C8EBF" stroke-width="1.5"/>
  <line x1="270" y1="356" x2="270" y2="396" stroke="#6C8EBF" stroke-width="1.5"/>

  <rect x="560" y="60" width="980" height="740" rx="10" fill="#fbfdfb" stroke="#82B366"/>
  <text x="580" y="88" font-size="15" font-weight="700" fill="#3f7a3a">AFTER — this round: reliable · actionable · watchful · proven</text>

  <rect x="585" y="120" width="410" height="86" rx="8" fill="#dae8fc" stroke="#6C8EBF"/>
  <text x="602" y="144" font-size="12" font-weight="700" fill="#222">Extension — side panel + scraper</text>
  <text x="602" y="163" font-size="11" fill="#444">Run research (streamed, live agent cards)</text>

  <rect x="1015" y="120" width="500" height="40" rx="8" fill="#d5e8d4" stroke="#82B366"/>
  <text x="1030" y="137" font-size="11" font-weight="700" fill="#2f5a2a">+ Actionable output</text>
  <text x="1030" y="152" font-size="10" fill="#2f5a2a">editable title/Highlights · char limits · copy-per-field · Re-verify</text>

  <rect x="1015" y="166" width="500" height="40" rx="8" fill="#d5e8d4" stroke="#82B366"/>
  <text x="1030" y="183" font-size="11" font-weight="700" fill="#2f5a2a">+ Listing Monitor</text>
  <text x="1030" y="198" font-size="10" fill="#2f5a2a">save baseline (chrome.storage) · Check drift · likely-cause banner</text>

  <rect x="585" y="250" width="410" height="52" rx="8" fill="#d5e8d4" stroke="#82B366"/>
  <text x="602" y="271" font-size="11" font-weight="700" fill="#2f5a2a">+ lib/claude.ts</text>
  <text x="602" y="288" font-size="10" fill="#2f5a2a">structured outputs · mixed models · effort · cached July-27 policy</text>

  <rect x="585" y="312" width="410" height="46" rx="8" fill="#d5e8d4" stroke="#82B366"/>
  <text x="602" y="331" font-size="11" font-weight="700" fill="#2f5a2a">+ lib/agents.ts</text>
  <text x="602" y="348" font-size="10" fill="#2f5a2a">runDrift / runVerify — shared source of truth</text>

  <rect x="1015" y="250" width="500" height="52" rx="8" fill="#dae8fc" stroke="#6C8EBF"/>
  <text x="1030" y="271" font-size="11" font-weight="700" fill="#222">api/research.ts</text>
  <text x="1030" y="288" font-size="10" fill="#444">4 lenses (Sonnet) → synth (Opus) → verify · structured outputs</text>

  <rect x="1015" y="308" width="500" height="38" rx="8" fill="#d5e8d4" stroke="#82B366"/>
  <text x="1030" y="332" font-size="11" fill="#2f5a2a"><tspan font-weight="700">+ api/verify.ts</tspan> — re-verify an edited draft</text>

  <rect x="1015" y="352" width="500" height="38" rx="8" fill="#d5e8d4" stroke="#82B366"/>
  <text x="1030" y="376" font-size="11" fill="#2f5a2a"><tspan font-weight="700">+ api/drift.ts</tspan> — baseline vs live · severity · likely-cause (Opus)</text>

  <rect x="585" y="420" width="410" height="70" rx="8" fill="#d5e8d4" stroke="#82B366"/>
  <text x="602" y="443" font-size="11" font-weight="700" fill="#2f5a2a">+ eval/  — 31 labeled examples → run.ts</text>
  <text x="602" y="461" font-size="10" fill="#2f5a2a">scores precision / recall / false-positive rate</text>
  <text x="602" y="478" font-size="10" fill="#2f5a2a">→ SCORECARD.md  (eval → fix → re-eval loop)</text>

  <rect x="585" y="540" width="930" height="60" rx="8" fill="#dae8fc" stroke="#6C8EBF"/>
  <text x="602" y="566" font-size="12" font-weight="700" fill="#222">Claude — Sonnet 4.6 (lenses/verify)  +  Opus 4.8 (synth/drift)  +  web_search</text>
  <text x="602" y="585" font-size="11" fill="#444">latest Anthropic SDK (0.112)</text>

  <path d="M790,420 L790,358" fill="none" stroke="#82B366" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="798" y="392" font-size="10" fill="#3f7a3a">tests the real runDrift</text>
  <line x1="995" y1="335" x2="1015" y2="335" stroke="#6C8EBF" stroke-width="1.4"/>
  <line x1="790" y1="302" x2="790" y2="312" stroke="#82B366" stroke-width="1.4"/>
  <line x1="1040" y1="600" x2="1040" y2="620" stroke="#6C8EBF" stroke-width="0"/>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#82B366"/></marker>
  </defs>
</svg>
