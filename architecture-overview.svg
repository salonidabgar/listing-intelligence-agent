<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#444"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#B85450"/>
    </marker>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#9673A6"/>
    </marker>
  </defs>
  <rect width="1520" height="720" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#222">Listing Intelligence Agent — Architecture &amp; Data Flow</text>

  <rect x="20" y="70" width="450" height="620" rx="10" fill="#eaf1fb" stroke="#6C8EBF"/>
  <text x="40" y="98" font-size="14" font-weight="700" fill="#3b5c8a">CHROME BROWSER  (user's laptop)</text>

  <rect x="40" y="120" width="410" height="82" rx="8" fill="#fff" stroke="#6C8EBF"/>
  <text x="60" y="145" font-size="13" font-weight="700" fill="#222">Content script + scraper.ts</text>
  <text x="60" y="165" font-size="12" fill="#444">Injected into the Amazon tab.</text>
  <text x="60" y="183" font-size="12" fill="#444">Reads the page DOM: ASIN, title, reviews, image.</text>

  <rect x="40" y="252" width="410" height="118" rx="8" fill="#fff" stroke="#6C8EBF"/>
  <text x="60" y="277" font-size="13" font-weight="700" fill="#222">Side Panel — React app</text>
  <text x="60" y="298" font-size="12" fill="#444">App.tsx — the UI you see (agent cards, results)</text>
  <text x="60" y="316" font-size="12" fill="#444">api.ts — scrape message + HTTP stream reader</text>
  <text x="60" y="334" font-size="12" fill="#444">config.ts / sample.ts</text>
  <text x="60" y="356" font-size="11" fill="#888" font-style="italic">Cannot read the page directly — must ask the content script.</text>

  <rect x="40" y="410" width="410" height="56" rx="8" fill="#fff" stroke="#6C8EBF"/>
  <text x="60" y="435" font-size="13" font-weight="700" fill="#222">Background service worker (index.ts)</text>
  <text x="60" y="454" font-size="12" fill="#444">Opens the side panel on icon click.</text>

  <rect x="40" y="500" width="410" height="56" rx="8" fill="#eef4fc" stroke="#6C8EBF" stroke-dasharray="5 4"/>
  <text x="60" y="524" font-size="12" font-weight="700" fill="#222">manifest.config.ts — the extension's ID card</text>
  <text x="60" y="543" font-size="11" fill="#444">permissions, allowed hosts, wires all parts together</text>

  <rect x="540" y="70" width="540" height="620" rx="10" fill="#e9f5e8" stroke="#82B366"/>
  <text x="560" y="98" font-size="14" font-weight="700" fill="#3f7a3a">BACKEND  —  npm run dev (local)  or  Vercel (prod)</text>

  <rect x="560" y="120" width="500" height="62" rx="8" fill="#fff" stroke="#82B366"/>
  <text x="580" y="145" font-size="13" font-weight="700" fill="#222">dev-server.ts (router)</text>
  <text x="580" y="165" font-size="12" fill="#444">Loads .env.local (holds the API key) · routes /api/* to handlers</text>

  <rect x="555" y="210" width="510" height="392" rx="8" fill="none" stroke="#82B366" stroke-dasharray="6 4"/>
  <text x="572" y="232" font-size="12" font-weight="700" font-style="italic" fill="#3f7a3a">/api/research.ts — streaming multi-agent pipeline</text>
  <text x="572" y="252" font-size="11" font-style="italic" fill="#7a7a2a">4 agents run in PARALLEL (Promise.all), each uses the web_search tool</text>

  <rect x="575" y="266" width="230" height="52" rx="8" fill="#fff2cc" stroke="#D6B656"/>
  <text x="690" y="288" font-size="12" font-weight="700" fill="#222" text-anchor="middle">Market /</text>
  <text x="690" y="306" font-size="12" font-weight="700" fill="#222" text-anchor="middle">Competitor agent</text>

  <rect x="820" y="266" width="230" height="52" rx="8" fill="#fff2cc" stroke="#D6B656"/>
  <text x="935" y="288" font-size="12" font-weight="700" fill="#222" text-anchor="middle">Keyword / SEO</text>
  <text x="935" y="306" font-size="12" font-weight="700" fill="#222" text-anchor="middle">+ Rufus agent</text>

  <rect x="575" y="332" width="230" height="52" rx="8" fill="#fff2cc" stroke="#D6B656"/>
  <text x="690" y="354" font-size="12" font-weight="700" fill="#222" text-anchor="middle">Voice-of-customer</text>
  <text x="690" y="372" font-size="12" font-weight="700" fill="#222" text-anchor="middle">agent</text>

  <rect x="820" y="332" width="230" height="52" rx="8" fill="#fff2cc" stroke="#D6B656"/>
  <text x="935" y="354" font-size="12" font-weight="700" fill="#222" text-anchor="middle">Compliance /</text>
  <text x="935" y="372" font-size="12" font-weight="700" fill="#222" text-anchor="middle">July-27 agent</text>

  <rect x="575" y="428" width="475" height="52" rx="8" fill="#e1d5e7" stroke="#9673A6"/>
  <text x="595" y="450" font-size="12" font-weight="700" fill="#222">Synthesizer agent</text>
  <text x="595" y="468" font-size="11" fill="#444">optimized title (≤75) + Item Highlights (≤125) + bullets + keywords + actions</text>

  <rect x="575" y="504" width="475" height="52" rx="8" fill="#e1d5e7" stroke="#9673A6"/>
  <text x="595" y="526" font-size="12" font-weight="700" fill="#222">Verifier (red-team) agent</text>
  <text x="595" y="544" font-size="11" fill="#444">risks · compliance notes · confidence</text>

  <rect x="1140" y="70" width="360" height="620" rx="10" fill="#fff1e0" stroke="#D79B00"/>
  <text x="1160" y="98" font-size="14" font-weight="700" fill="#a9760a">ANTHROPIC  (cloud)</text>

  <rect x="1170" y="300" width="300" height="170" rx="8" fill="#f8cecc" stroke="#B85450"/>
  <text x="1320" y="340" font-size="15" font-weight="700" fill="#222" text-anchor="middle">Claude</text>
  <text x="1320" y="362" font-size="12" fill="#444" text-anchor="middle">claude-sonnet-4-6</text>
  <text x="1320" y="392" font-size="12" font-weight="700" fill="#8a3a37" text-anchor="middle">+ web_search server tool</text>
  <text x="1320" y="414" font-size="11" fill="#444" text-anchor="middle">live web research, billed to</text>
  <text x="1320" y="430" font-size="11" fill="#444" text-anchor="middle">your Anthropic key</text>

  <line x1="245" y1="410" x2="245" y2="372" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="252" y="392" font-size="11" fill="#444">1 opens panel</text>

  <line x1="150" y1="252" x2="150" y2="204" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="156" y="230" font-size="11" fill="#444">2 SCRAPE_LISTING</text>

  <line x1="360" y1="202" x2="360" y2="250" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="366" y="230" font-size="11" fill="#444">3 listing JSON</text>

  <path d="M450,285 L500,285 L500,151 L558,151" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="470" y="200" font-size="11" fill="#222" font-weight="700">4 POST</text>
  <text x="462" y="216" font-size="11" fill="#222" font-weight="700">/api/research</text>

  <path d="M555,545 L505,545 L505,345 L452,345" fill="none" stroke="#B85450" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="360" y="500" font-size="11" fill="#B85450" font-weight="700">6 NDJSON</text>
  <text x="360" y="516" font-size="11" fill="#B85450" font-weight="700">event stream</text>

  <line x1="810" y1="182" x2="810" y2="210" stroke="#82B366" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="818" y="202" font-size="11" fill="#3f7a3a">routes</text>

  <path d="M1050,292 L1110,292 L1110,345 L1168,345" fill="none" stroke="#B85450" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="1058" y="284" font-size="11" fill="#B85450" font-weight="700">5 messages.create</text>
  <text x="1058" y="300" font-size="11" fill="#B85450" font-weight="700">+ web_search</text>

  <path d="M1168,415 L1110,415 L1110,358 L1052,358" fill="none" stroke="#B85450" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="1088" y="440" font-size="11" fill="#B85450">findings</text>

  <line x1="690" y1="384" x2="690" y2="428" stroke="#9673A6" stroke-width="1.5" marker-end="url(#arrP)"/>
  <text x="698" y="412" font-size="11" fill="#9673A6">all findings</text>

  <line x1="812" y1="480" x2="812" y2="504" stroke="#9673A6" stroke-width="1.5" marker-end="url(#arrP)"/>
  <text x="820" y="497" font-size="11" fill="#9673A6">draft</text>
</svg>
